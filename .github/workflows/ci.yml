name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Verify 3D environment stack
        run: python scripts/detect_env.py
      - name: Run full pytest suite (recipes, meshkit, PBR, meshgen v2, renderer, compare, offline preview)
        run: pytest -v
      - name: E2E generation (vase & katana, 4 formats + validate)
        run: |
          python scripts/generate.py vase --formats glb obj stl usdz --out /tmp/ci-out --size 256
          python scripts/validate.py /tmp/ci-out/vase/vase.stl
          python scripts/generate.py katana --formats glb obj stl usdz --out /tmp/ci-out --size 256
          python scripts/validate.py /tmp/ci-out/katana/katana.stl
      - name: E2E turbo_forge v5.2 + gates mesurables + critique sur sortie turbo
        run: |
          python scripts/turbo_forge.py sci_fi_crate --lod0-tris 2800 -o /tmp/turbo-ci
          python scripts/gates.py /tmp/turbo-ci --target hero
          python scripts/critique.py brief --dir /tmp/turbo-ci --iter 1
          python scripts/critique.py policy
      - name: Fraîcheur doc/code (table recettes générée + bench mesuré)
        run: |
          python scripts/generate.py --list --markdown > /tmp/recipes.md
          diff /tmp/recipes.md references/recipes.md
          python scripts/bench.py --check
      - name: CI visuelle (IoU silhouette vs baseline commité)
        run: python scripts/visual_regression.py
      - name: Evals headless du skill (sous-ensemble rapide)
        run: python evals/run.py --ids 1,4,5,8 | tee /tmp/evals_summary.txt
      - name: "Commentaire PR (résumé QA gates + evals)"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 3d-forge — QA CI"
            echo
            echo '```'
            cat /tmp/turbo-ci/qa_summary.md
            echo '```'
            echo
            echo '```'
            cat /tmp/evals_summary.txt
            echo '```'
          } > /tmp/pr_comment.md
          gh pr comment "${{ github.event.pull_request.number }}"             --body-file /tmp/pr_comment.md || echo "commentaire PR ignoré
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-outputs
          path: /tmp/ci-out
          retention-days: 7
